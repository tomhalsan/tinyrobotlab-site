<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%" style="background-color: #ffffff;">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap");
      text { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 12px; font-weight: 500; fill: #475569; }
      .container-title { font-size: 12px; font-weight: 700; }
      .box-title { font-size: 11px; font-weight: 700; }
      .box-desc { font-size: 10px; font-weight: 400; }
      .step-num { font-size: 9px; font-weight: 700; }
      .step-title { font-size: 11px; font-weight: 600; }
      .step-desc { font-size: 9px; font-weight: 400; }
      .connector-label { font-size: 9px; font-weight: 600; }
      .legend-label { font-size: 10px; font-weight: 600; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4338ca" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="1200" height="960" fill="#ffffff" />

  <!-- Header -->
  <text x="600.0" y="35" class="title" text-anchor="middle">Autonomous Agent Lab — System Architecture</text>
  <text x="600.0" y="56" class="subtitle" text-anchor="middle">Capability-Routed Multi-Agent Platform with Asynchronous Redis Transport &amp; Grounded Inference</text>

  <rect x="480" y="78" width="240" height="36" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
  <text x="600" y="100" fill="#0f172a" font-size="12px" font-weight="600" text-anchor="middle" class="box-title">Operator / Browser User</text>
  <path d="M 600 114 L 600 138" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <rect x="558.0" y="118.0" width="84" height="16" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <text x="600" y="129" fill="#0369a1" font-size="9px" font-weight="600" text-anchor="middle" class="connector-label">Prompt Input</text>
  <rect x="360" y="138" width="480" height="48" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" />
  <text x="600" y="157" fill="#0369a1" font-size="12.5px" font-weight="700" text-anchor="middle" class="box-title">Prototype Console (Presentation UI • SPA)</text>
  <text x="600" y="173" fill="#0284c7" font-size="10px" font-weight="normal" text-anchor="middle" class="box-desc">Task Submission • Live Routing Progression • Grounded Results &amp; Attribution</text>
  <path d="M 600 186 L 600 226" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <rect x="545.0" y="197.5" width="110" height="17" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <text x="600" y="209" fill="#0369a1" font-size="9px" font-weight="600" text-anchor="middle" class="connector-label">HTTP / REST API</text>
  <rect x="90" y="226" width="1020" height="222" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2" />
  <text x="110" y="246" fill="#1e293b" font-size="12px" font-weight="700" text-anchor="start" class="container-title">ORCHESTRATOR CONTAINER (Docker: orchestrator | Port 8080)</text>
  <rect x="110" y="254" width="980" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="600" y="269" fill="#0369a1" font-size="11px" font-weight="700" text-anchor="middle" class="box-title">Presentation Layer (FastAPI REST Endpoints)</text>
  <text x="600" y="284" fill="#0c4a6e" font-size="10px" font-weight="500" text-anchor="middle" class="box-desc">POST /api/tasks   •   GET /api/tasks/{id}/routing   •   GET /api/tasks/{id}/result   •   GET /api/agents   •   GET /api/events</text>
  <rect x="110" y="302" width="980" height="84" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5" />
  <text x="600" y="318" fill="#3730a3" font-size="11px" font-weight="700" text-anchor="middle" class="box-title">Application &amp; Domain Layer — Capability-Based Routing &amp; Agent Selection</text>
  <rect x="125" y="326" width="215" height="50" rx="5" fill="#ffffff" stroke="#818cf8" stroke-width="1" />
  <text x="232.5" y="341" fill="#4338ca" font-size="9px" font-weight="700" text-anchor="middle" class="step-num">1. PROMPT INTENT</text>
  <text x="232.5" y="356" fill="#0f172a" font-size="11px" font-weight="600" text-anchor="middle" class="step-title">Keyword Classification</text>
  <text x="232.5" y="369" fill="#64748b" font-size="9px" font-weight="normal" text-anchor="middle" class="step-desc">SubmitTask Use Case</text>
  <rect x="375" y="326" width="215" height="50" rx="5" fill="#ffffff" stroke="#818cf8" stroke-width="1" />
  <text x="482.5" y="341" fill="#4338ca" font-size="9px" font-weight="700" text-anchor="middle" class="step-num">2. CAPABILITY ROUTING</text>
  <text x="482.5" y="356" fill="#0f172a" font-size="11px" font-weight="600" text-anchor="middle" class="step-title">GENERAL vs RESEARCH</text>
  <text x="482.5" y="369" fill="#64748b" font-size="9px" font-weight="normal" text-anchor="middle" class="step-desc">DeterministicCapabilityRouter</text>
  <rect x="625" y="326" width="215" height="50" rx="5" fill="#ffffff" stroke="#818cf8" stroke-width="1" />
  <text x="732.5" y="341" fill="#4338ca" font-size="9px" font-weight="700" text-anchor="middle" class="step-num">3. CANDIDATE DISCOVERY</text>
  <text x="732.5" y="356" fill="#0f172a" font-size="11px" font-weight="600" text-anchor="middle" class="step-title">Evaluate Registry &amp; Heartbeats</text>
  <text x="732.5" y="369" fill="#64748b" font-size="9px" font-weight="normal" text-anchor="middle" class="step-desc">LivenessPolicy (READY &amp; Fresh)</text>
  <rect x="875" y="326" width="215" height="50" rx="5" fill="#ffffff" stroke="#818cf8" stroke-width="1" />
  <text x="982.5" y="341" fill="#4338ca" font-size="9px" font-weight="700" text-anchor="middle" class="step-num">4. AGENT SELECTION</text>
  <text x="982.5" y="356" fill="#0f172a" font-size="11px" font-weight="600" text-anchor="middle" class="step-title">Deterministic Selection Policy</text>
  <text x="982.5" y="369" fill="#64748b" font-size="9px" font-weight="normal" text-anchor="middle" class="step-desc">Selected Agent &amp; Target Queue</text>
