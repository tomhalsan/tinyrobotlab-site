  <text x="337.5" y="717" fill="#0f172a" font-size="11px" font-weight="600" text-anchor="middle" class="box-title">TaskProcessor (idle ➔ working ➔ idle)  •  HeartbeatRunner (10s pulse)</text>
  <text x="337.5" y="733" fill="#64748b" font-size="9.5px" font-weight="normal" text-anchor="middle" class="box-desc">RedisBus Adapter  •  General Computation  •  Inference Provider Boundary</text>
  <rect x="615" y="645" width="495" height="115" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  <text x="635" y="667" fill="#0f172a" font-size="12px" font-weight="700" text-anchor="start" class="container-title">RESEARCH AGENT (Docker: research-agent | research-agent-1)</text>
  <text x="635" y="685" fill="#334155" font-size="10px" font-weight="600" text-anchor="start" class="box-desc">Advertised Capability: 'research'  •  Target Queue: agent.tasks.research</text>
  <rect x="635" y="697" width="455" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="862.5" y="717" fill="#0f172a" font-size="11px" font-weight="600" text-anchor="middle" class="box-title">ResearchProcessor (Multi-Step Pipeline)  •  HeartbeatRunner (10s pulse)</text>
