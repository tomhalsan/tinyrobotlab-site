  <text x="940" y="569" fill="#e11d48" font-size="10px" font-weight="600" text-anchor="middle" class="box-desc">task.routing:{id}  •  task.result:{id}  •  agent.events</text>
  <path d="M 260 584 L 260 645" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr-red)" />
