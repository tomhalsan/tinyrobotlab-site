  <text x="600" y="569" fill="#e11d48" font-size="10px" font-weight="600" text-anchor="middle" class="box-desc">agent.registry:{id}  •  agent.heartbeat:{id} (10s pulse)</text>
  <rect x="790" y="532" width="300" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1" />
