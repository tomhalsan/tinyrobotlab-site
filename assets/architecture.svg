  <text x="110" y="522" fill="#9f1239" font-size="12px" font-weight="700" text-anchor="start" class="container-title">REDIS TRANSPORT &amp; STATE STORE (Docker: redis | redis:7-alpine | AOF Persistence)</text>
  <rect x="110" y="532" width="300" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1" />
  <text x="260" y="551" fill="#881337" font-size="11px" font-weight="700" text-anchor="middle" class="box-title">Task Queues (FIFO Lists)</text>
  <text x="260" y="569" fill="#e11d48" font-size="10px" font-weight="600" text-anchor="middle" class="box-desc">agent.tasks.general  •  agent.tasks.research</text>
  <rect x="430" y="532" width="340" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1" />
