  <rect x="90" y="645" width="495" height="115" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2" />
  <text x="110" y="667" fill="#0f172a" font-size="12px" font-weight="700" text-anchor="start" class="container-title">GENERAL WORKER (Docker: worker | worker-1)</text>
