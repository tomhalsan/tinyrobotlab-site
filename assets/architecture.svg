  <rect x="110" y="394" width="980" height="38" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1" />
  <text x="600" y="409" fill="#166534" font-size="11px" font-weight="700" text-anchor="middle" class="box-title">Infrastructure Layer — RedisGateway</text>
  <text x="600" y="424" fill="#14532d" font-size="10px" font-weight="500" text-anchor="middle" class="box-desc">Implements Abstract Ports: TaskDispatcher, StateReader, RoutingRecorder, ResultReader, EventPublisher</text>
  <path d="M 600 448 L 600 500" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr-red)" />
  <rect x="512.5" y="465.0" width="175" height="18" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="1" />
